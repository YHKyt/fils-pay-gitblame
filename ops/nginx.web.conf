# Serves the merchant dashboard (apps/web build) and forwards /v1 to the api
# on the same origin. apps/api has no CORS handling, so the browser can only
# call it same-origin; this proxy is what makes login and the public
# checkout (/pay/:token) work when hosted. Mirrors apps/web/vite.config.ts.
server {
    listen 8080;
    server_name _;

    # Relative Location headers: the container port (8080) is not
    # necessarily the port or scheme the browser used.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # KYC documents go up to KYC_MAX_FILE_SIZE_BYTES (8 MiB by default);
    # nginx's own 1 MiB default would reject them with 413 before the api.
    client_max_body_size 10m;

    location /v1/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built assets carry a content hash in their name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The SPA has no route for "/" (it renders a 404); send people to the dashboard.
    location = / {
        return 302 /dashboard;
    }

    # Client-side routes (/dashboard/..., /pay/:token) all load the SPA.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
