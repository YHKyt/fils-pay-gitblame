# Serves the merchant dashboard (apps/web build) at /, the admin console
# (apps/admin build) at /admin/, and forwards /v1 to the api on the same
# origin. apps/api has no CORS handling, so the browser can only
# call it same-origin; this proxy is what makes login and the public
# checkout (/pay/:token) work when hosted. Mirrors apps/web/vite.config.ts.
#
# This is also the only public entry point, so it carries the abuse limits
# (ops/README.md, "Running it in public"). The directives above `server` are
# http-level: the image includes conf.d/*.conf inside its http block.

# ---------------------------------------------------------------- client IP
# Behind a TLS proxy or load balancer on a private network (Caddy on the box,
# a provider load balancer), every connection comes from that proxy. Take the
# client address from its X-Forwarded-For instead, so the per-client limits
# below are per client and not one bucket for everybody. Only private-range
# peers are believed; a client connecting directly from a public address
# cannot pick its own address with that header. real_ip_recursive skips the
# trusted hops and uses the right-most address the proxy appended, so a
# forged entry at the front of the header is ignored too.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from fc00::/7;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ------------------------------------------------------------ abuse limits
# Numbers measured on the hosted box's size (1 vCPU for the whole stack, the
# api held to 0.5 vCPU); see ops/README.md, "Running it in public".
#
# Per client address. One client cannot take the box for itself, yet the
# automated suite (ops/e2e/judge-suite.mjs: about 190 requests in 11 s, at
# most 54 req/s overall, 10 auth and 6 pay requests in one second) never sees
# a 429, with 10x headroom or more, and a load test from a single address
# reaches the box's real checkout capacity (about 43 checkouts/s) before
# these rates do:
#   hh_api   every proxied request (/v1, /healthz, /readyz)
#   hh_auth  password logins, OTP verify and resend, merchant signup: each
#            login costs an argon2 hash (about 19 MiB and tens of ms of CPU)
#            whether or not the account exists, the CPU-exhaustion lever
#   hh_pay   public checkout pay: unauthenticated, writes a transaction and
#            calls the acquirer
#   hh_conn  open connections (slowloris, socket hoarding)
# `burst ... nodelay` lets a spike of up to `burst` requests through at once
# and answers anything beyond it with 429 straight away. Nothing is queued:
# a queue only turned the excess into multi-second waits (measured: logins
# from one address took 6 s each behind a 5 r/s queue).
#
# Whole-box in-flight caps (key $server_name: one counter for everybody).
# Past the box's capacity, extra requests only queue inside the api and
# every answer gets slower. These answer the excess at once with 429
# instead, so what is admitted stays usable:
#   hh_inflight      all proxied requests
#   hh_pay_inflight  checkout pays: 50 (the sweep: 40 concurrent checkouts
#                    at p95 1.5 s, 50 at p95 2.1-2.4 s)
#   hh_auth_inflight logins: 16. argon2 runs four at a time on libuv's
#                    thread pool; a deeper queue also starves the SCRAM
#                    hashing of new Postgres connections, which then time
#                    out (measured: a login flood straight at the api got
#                    84 x 500 "Connection terminated due to connection
#                    timeout").
limit_req_zone $binary_remote_addr zone=hh_api:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=hh_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=hh_pay:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=hh_conn:10m;
limit_conn_zone $server_name zone=hh_inflight:1m;
limit_conn_zone $server_name zone=hh_pay_inflight:1m;
limit_conn_zone $server_name zone=hh_auth_inflight:1m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# One pool of reused connections to the api instead of a new TCP connection
# per request.
upstream filspay_api {
    server api:3000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # Relative Location headers: the container port (8080) is not
    # necessarily the port or scheme the browser used.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------- slow clients
    # A client must send its headers within 10 s and keep a body moving
    # (20 s between reads), or the connection is closed; idle keep-alive
    # connections are dropped after 30 s. nginx buffers whole request bodies
    # before the api sees them, so a slow upload never ties up the api.
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    limit_conn hh_conn 256;

    # KYC documents go up to KYC_MAX_FILE_SIZE_BYTES (8 MiB by default);
    # nginx's own 1 MiB default would reject them with 413 before the api.
    # The public, unauthenticated routes below take far less.
    client_max_body_size 10m;
    # Over that limit nginx answers 413 itself, with an HTML page. Give API
    # clients the api's uniform JSON error body instead.
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":"payload_too_large","message":"request body is too large"}';
    }
    # The same for the limits above and for an api that is down or restarting.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":"rate_limited","message":"too many requests from this address, retry shortly"}';
    }
    error_page 502 503 504 = @unavailable;
    location @unavailable {
        default_type application/json;
        add_header Retry-After 5 always;
        return 503 '{"error":"service_unavailable","message":"the API is temporarily unavailable, retry shortly"}';
    }

    # ------------------------------------------------------- proxy to api
    # Inherited by every proxying location below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    # A location with its own limit_conn does not inherit the server's, so
    # every proxying location repeats hh_conn.
    location /v1/ {
        limit_req zone=hh_api burst=1000 nodelay;
        limit_conn hh_conn 256;
        limit_conn hh_inflight 80;
        proxy_pass http://filspay_api;
    }

    # A full settlement run started from the console can take minutes.
    location /v1/admin/ {
        limit_req zone=hh_api burst=1000 nodelay;
        limit_conn hh_conn 256;
        limit_conn hh_inflight 80;
        proxy_read_timeout 300s;
        proxy_pass http://filspay_api;
    }

    # Password logins, OTP verify/resend (merchant and admin).
    location ~ ^/v1/(admin/)?auth/(login|otp/) {
        limit_req zone=hh_auth burst=60 nodelay;
        limit_req zone=hh_api burst=1000 nodelay;
        limit_conn hh_conn 256;
        limit_conn hh_inflight 80;
        limit_conn hh_auth_inflight 16;
        client_max_body_size 64k;
        proxy_pass http://filspay_api;
    }

    # Public merchant signup (POST /v1/merchants): an argon2 hash and a new
    # merchant per request.
    location = /v1/merchants {
        limit_req zone=hh_auth burst=60 nodelay;
        limit_req zone=hh_api burst=1000 nodelay;
        limit_conn hh_conn 256;
        limit_conn hh_inflight 80;
        limit_conn hh_auth_inflight 16;
        client_max_body_size 64k;
        proxy_pass http://filspay_api;
    }

    # Public checkout pay.
    location ~ ^/v1/payment-links/[^/]+/pay$ {
        limit_req zone=hh_pay burst=500 nodelay;
        limit_req zone=hh_api burst=1000 nodelay;
        limit_conn hh_conn 256;
        limit_conn hh_inflight 80;
        limit_conn hh_pay_inflight 50;
        client_max_body_size 64k;
        proxy_pass http://filspay_api;
    }

    # The api's unprefixed health probes, so one public origin serves the
    # whole API surface (otherwise the SPA fallback answered them with HTML).
    location ~ ^/(healthz|readyz)$ {
        limit_req zone=hh_api burst=1000 nodelay;
        limit_conn hh_conn 256;
        limit_conn hh_inflight 80;
        proxy_pass http://filspay_api;
    }

    # Built assets carry a content hash in their name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /admin/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /admin {
        return 302 /admin/;
    }

    # Admin console client routes (/admin/login, /admin/merchants/...).
    location /admin/ {
        try_files $uri /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # The SPA has no route for "/" (it renders a 404); send people to the dashboard.
    location = / {
        return 302 /dashboard;
    }

    # Client-side routes (/dashboard/..., /pay/:token) all load the SPA.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
