# Main nginx config for the web image: the stock nginx:1.27-alpine file,
# with more connections per worker. The stock 1024 is shared between client
# connections and the connections nginx opens to the api (two per proxied
# request), so a handful of clients at the per-address connection cap
# (limit_conn hh_conn in nginx.web.conf) could fill it. The site itself is
# nginx.web.conf.
user  nginx;
# One worker per CPU: one on the hosted 1 vCPU box.
worker_processes  auto;
worker_rlimit_nofile 16384;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    server_tokens   off;

    include /etc/nginx/conf.d/*.conf;
}
